#
# DSV4.1-Flash MedPix LoRA SFT with random initialization for Kunlun XPU.
# 2 nodes x 16 P800 PCIe = 32 XPU, EP=32, LoRA r8 on attention + routed experts.
# Base weights are not loaded (random init); vision tower is frozen.

recipe: FinetuneRecipeForVLM
seed: 1234

step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 10
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v41.config.DeepseekV41Config.from_pretrained
    pretrained_model_name_or_path: /ssd1/liyiming06/deepseek41-nemo-smoke-20261110/ds41-medpix/ckpt/deepseek_v41_flash_config
    name_or_path: /ssd1/liyiming06/deepseek41-nemo-smoke-20261110/ds41-medpix/ckpt/deepseek_v41_flash_config
  trust_remote_code: false
  load_base_model: false
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: eager
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: torch
    gate_precision: float32
    compile_hc: true
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: nemo_automodel.components.models.deepseek_v41.processing.DeepseekV41Processor.from_pretrained
  pretrained_model_name_or_path: /ssd1/liyiming06/deepseek41-nemo-smoke-20261110/ds41-medpix/ckpt/deepseek_v41_flash_config
  trust_remote_code: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
    - "model.layers.*.attn.wq_a"
    - "model.layers.*.attn.wq_b"
    - "model.layers.*.attn.wkv"
    - "model.layers.*.attn.wo_b"
    - "model.layers.*.ffn.experts"
  dim: 8
  alpha: 32
  use_triton: false

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  cp_size: 1
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    lm_head_precision: float32
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

freeze_config:
  freeze_vision_tower: true
  freeze_language_model: false

checkpoint:
  enabled: false
  checkpoint_dir: ../checkpoints/deepseek_v41_flash_medpix_lora_ep32_2node_kunlun
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: /ssd1/liyiming06/deepseek41-nemo-smoke-20261110/ds41-medpix/data
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 4097

validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 5.0e-6
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_steps: 100
  lr_decay_style: cosine
  min_lr: 5.0e-7

clip_grad_norm:
  backend: te
  max_norm: 1.0

wandb:
  enable: false
  entity: Nemo-automodel
  project: automodel-ds41-medpix
  name: ds41-medpix-lora-ep32-2node-kunlun-random-init
  mode: online
  dir: ../logs/wandb

ci:
  recipe_owner: huiyingl
  nodes: 2
  cluster_tag: kunlun
  time: "01:00:00"
