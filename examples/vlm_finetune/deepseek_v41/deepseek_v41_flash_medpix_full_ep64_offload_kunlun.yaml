#
# DSV4.1-Flash full-parameter MedPix-VQA SFT on 8 nodes x 8 Kunlun P800 cards
# (64 ranks): full model architecture (40 layers, 384 routed experts, Engram,
# vision tower), every parameter trainable, EP=64, FSDP2 with CPU offload.
#
# UNVERIFIED above 8 cards. Capacity, for 749B parameters in BF16: 1,498 GB of
# parameters, as much again in gradients, and two BF16 AdamW states on top,
# about 6 TB of state. 64 cards hold 6.0 TiB, so it cannot sit on device at
# all; offloaded it is roughly 750 GB of host state per node against the
# 1.47 TiB these nodes have, which is the first shape that fits. The optimizer
# step then runs on the CPU, so expect very low throughput.
#
# Watch two things. EP=64 across 64 ranks leaves no DP dimension, so parameter
# groups that are expert-partitioned rather than FSDP-sharded land per rank
# whole; the Engram tables (196.6B parameters, 393 GB in BF16) are the group to
# check first. And the first cross-node collective, an int64 all_reduce of
# token counts, has crashed BKCL's tree-proxy kernel on the TI-ONE cluster at
# two nodes, which will stop this run before the first step.
#
# load_base_model stays false, so weights are random: the 510 GB official
# checkpoint has not been downloaded. Set it to true and point
# pretrained_model_name_or_path at a local snapshot for a real SFT.
#
# Launch with examples/vlm_finetune/deepseek_v41/run_medpix_full_8node_tione.sh
recipe: FinetuneRecipeForVLM
seed: 1234

step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 10
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v41.config.DeepseekV41Config.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
    name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
    revision: df42c109f1defefcbfcedbe7d905718a12266e40  # pragma: allowlist secret (public model commit SHA)
  trust_remote_code: false
  load_base_model: false
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: eager
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: torch
    gate_precision: float32
    compile_hc: false
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: nemo_automodel.components.models.deepseek_v41.processing.DeepseekV41Processor.from_pretrained
  pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
  revision: df42c109f1defefcbfcedbe7d905718a12266e40  # pragma: allowlist secret (public model commit SHA)
  trust_remote_code: false

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  cp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  # Sharded parameters, gradients and optimizer state stay in host memory and
  # are gathered per layer. pin_memory is off: pinning terabytes fails.
  offload_policy:
    _target_: torch.distributed.fsdp.CPUOffloadPolicy
    pin_memory: false
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    lm_head_precision: float32
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

freeze_config:
  freeze_vision_tower: false
  freeze_language_model: false

checkpoint:
  enabled: false
  checkpoint_dir: ./out-full-ep64-offload
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 1025

validation_dataset: none
validation_dataloader: none

optimizer:
  # Transformer Engine is not available on XPU; this is the optimizer the P800
  # runs use. Updates and Adam state are BF16, which the recipe warns about.
  _target_: torch.optim.AdamW
  lr: 5.0e-6
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_steps: 100
  lr_decay_style: cosine
  min_lr: 5.0e-7

clip_grad_norm:
  backend: triton
  max_norm: 1.0

wandb:
  enable: false
  entity: Nemo-automodel
  project: automodel-ds41-medpix
  name: ds41-medpix-full-ep64-offload-kunlun-random-init
  mode: online
  dir: ../logs/wandb

ci:
  recipe_owner: liyiming06
  nodes: 8
  cluster_tag: p800
  time: "01:00:00"
